[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "osa"
dynamic = ["version"]
description = "OSA — personal AI agent"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [
    { name = "OSA Project" }
]
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.5,<0.6",
    "faster-whisper>=1.2.1,<2.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.9,<1.0",
]
gui = [
    "PySide6>=6.6",
]
browser = [
    "playwright>=1.40",
]
windows = [
    "pywinauto>=0.6.9,<1.0",
    "Pillow>=10.0",
]
voice = [
    "edge-tts>=6.1",
]

[project.scripts]
osa = "osa.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "osa.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osa = ["prompts/*.txt", "config/chat_templates/*.jinja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# HTML template strings in GUI widgets are long by nature.
"src/osa/gui/widgets.py" = ["E501"]
